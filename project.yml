name: GreenZone
options:
  bundleIdPrefix: com.greenzone
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Set your Apple Developer team locally so SweetPad/Xcode can sign to your device:
    # DEVELOPMENT_TEAM: ABCDE12345
    CODE_SIGN_STYLE: Automatic

targets:
  GreenZone:
    type: application
    platform: iOS
    sources:
      - path: GreenZone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.greenzone.app
        PRODUCT_NAME: GreenZone
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    info:
      path: GreenZone/Info.plist
      properties:
        CFBundleDisplayName: GreenZone
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - location
        NSLocationWhenInUseUsageDescription: "GreenZone uses your location to draw and color the route you travel during a trip."
        NSLocationAlwaysAndWhenInUseUsageDescription: "GreenZone keeps tracking your location during an active trip so it can keep painting your route even when the app is in the background or the screen is off."
        NSCameraUsageDescription: "GreenZone lets you attach photos of properties and observations to a trip."
        NSPhotoLibraryUsageDescription: "GreenZone lets you attach photos from your library to a trip."

  GreenZoneTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GreenZoneTests
    dependencies:
      - target: GreenZone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.greenzone.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  GreenZone:
    build:
      targets:
        GreenZone: all
        GreenZoneTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GreenZoneTests

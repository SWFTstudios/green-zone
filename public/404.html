<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Green Zone</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <style>
    :root { --bg: #f5f7f5; --ink: #111a15; --muted: #5b6660; --brand: #15803d; color-scheme: light; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0b110d; --ink: #ecf3ee; --muted: #91a198; --brand: #22c55e; color-scheme: dark; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink); font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; }
    img { margin: 0 auto 1rem; border-radius: 14px; }
    h1 { margin: 0 0 .4rem; letter-spacing: -0.03em; }
    p { color: var(--muted); margin: 0 0 1.4rem; }
    a { display: inline-block; margin: 0 .4rem; font-weight: 700; color: var(--brand); text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <img src="/icon.svg" alt="" width="56" height="56">
    <h1>This street isn't on the map.</h1>
    <p>The page you're looking for doesn't exist.</p>
    <a href="/app">Open the app</a> <a href="/">Green Zone home</a>
  </main>
</body>
</html>

name: Deploy to Cloudflare

# main -> production Worker "green-zone"
# any other branch -> preview Worker "green-zone-preview" (own database, sign-in code shown on screen)
on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    steps:
      - name: Check for a Cloudflare API token
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::error title=Missing CLOUDFLARE_API_TOKEN::Add a CLOUDFLARE_API_TOKEN repository secret (Settings > Secrets and variables > Actions). See 'Deploy to Cloudflare' in README.md."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - name: Apply database migrations
        run: |
          if [ "$TARGET" = production ]; then
            npx wrangler d1 migrations apply green-zone-db --remote --env=""
          else
            npx wrangler d1 migrations apply green-zone-preview-db --remote --env preview
          fi

      - name: Deploy Worker
        id: deploy
        run: |
          if [ "$TARGET" = production ]; then
            npx wrangler deploy --env="" 2>&1 | tee deploy.log
          else
            npx wrangler deploy --env preview 2>&1 | tee deploy.log
          fi
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -n 1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### Deployed $TARGET"
            echo ""
            echo "$url"
          } >> "$GITHUB_STEP_SUMMARY"
